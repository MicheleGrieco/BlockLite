[project]
name = "blocklite"
version = "0.2.0"
description = "A minimal account-based blockchain with proof-of-work, written from scratch in Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests.py"]
pythonpath = ["."]
addopts = "-q"
